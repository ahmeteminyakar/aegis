<!--
  Aegis favicon source. Wordmark cropped to first letter so it survives
  16x16 rendering. Monochrome on dark with the thermal-duality accent
  stripe underneath (cyan -> amber, 30% gradient transition in the
  middle). No icon glyph. The wordmark IS the mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb4d4"/>
      <stop offset="35%" stop-color="#3fb4d4"/>
      <stop offset="65%" stop-color="#d96b3a"/>
      <stop offset="100%" stop-color="#d96b3a"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" fill="#0a0a0b"/>

  <text
    x="16"
    y="22.5"
    text-anchor="middle"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-weight="500"
    font-size="24"
    fill="#f4f4f4"
    letter-spacing="0.04em"
  >A</text>

  <rect x="6" y="26.5" width="20" height="2" fill="url(#stripe)"/>
</svg>
