<!--
  Aegis Open Graph card source. 1200x630, the OG-standard size.
  Monochrome on dark. Big mono wordmark centered with the thermal-
  duality stripe under it. Engineering meta at the corners: concept
  state in top-left, tagline bottom-left. No 3D render, no stock
  photo, no marketing buzzword. The mark is the message.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb4d4"/>
      <stop offset="35%" stop-color="#3fb4d4"/>
      <stop offset="65%" stop-color="#d96b3a"/>
      <stop offset="100%" stop-color="#d96b3a"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#131316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0b"/>
  <rect width="1200" height="630" fill="url(#ambient)"/>

  <!-- top-left meta -->
  <text
    x="72"
    y="84"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="22"
    fill="#8a8a93"
    letter-spacing="3"
  >CONCEPT STAGE / Q2 2026</text>

  <!-- top-right meta -->
  <text
    x="1128"
    y="84"
    text-anchor="end"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="22"
    fill="#8a8a93"
    letter-spacing="3"
  >aegis.ahmetyakar.dev</text>

  <!-- main wordmark, centered -->
  <text
    x="600"
    y="346"
    text-anchor="middle"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-weight="500"
    font-size="172"
    fill="#f4f4f4"
    letter-spacing="22"
  >AEGIS</text>

  <!-- accent stripe under the wordmark -->
  <rect x="300" y="390" width="600" height="6" fill="url(#stripe)"/>

  <!-- sub-headline (small mono, like a spec line) -->
  <text
    x="600"
    y="450"
    text-anchor="middle"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="22"
    fill="#8a8a93"
    letter-spacing="6"
  >WEARABLE PELTIER WRISTBAND</text>

  <!-- bottom-left tagline -->
  <text
    x="72"
    y="566"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="20"
    fill="#8a8a93"
    letter-spacing="2.5"
  >BUILT IN THE OPEN / DESIGNED AROUND THE PHYSICS</text>

  <!-- bottom-right author -->
  <text
    x="1128"
    y="566"
    text-anchor="end"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="20"
    fill="#8a8a93"
    letter-spacing="2.5"
  >AHMET EMIN YAKAR</text>
</svg>
